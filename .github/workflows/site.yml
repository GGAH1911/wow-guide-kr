# 쐐기 공략 사이트: 매일 04:00(KST) Raider.IO 수집 → data 브랜치 → Pages 배포. main 에 코드가 올라와도 배포.
# - collect: 예약·수동 실행 때만. tools/ci/collect.sh (세계·세계(중국 제외)·중국·한국, 이상 검사 통과해야 씀)
#            레이드 순위(raid/comp.json)는 주 1회 목요일 04:00 KST(한국 초기화 직전)만 새로 받고, 다른 날은 data 브랜치의 지난 파일을 이어 쓴다
#            결과 수치(stats.json)와 순위표(rank/)를 data 브랜치에 커밋 1개로 덮어쓴다(기록을 쌓지 않아 저장소가 커지지 않음)
# - deploy : main 코드 + data 브랜치 최신 수치로 사이트를 만들어(tools/ci/assemble.sh) Pages 에 올린다
# - 예약 실행은 저장소 활동이 60일 없으면 꺼지므로, 수집 때마다 이 워크플로를 다시 켠다(keep-alive)
name: site
on:
  schedule:
    - cron: "0 19 * * *"   # 매일 04:00 KST (UTC 19:00)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      collect:
        description: "Raider.IO 수집부터 (끄면 배포만)"
        type: boolean
        default: true
      raid:
        description: "레이드 순위 수집 (auto: 목요일이거나 지난 파일이 8일 넘었을 때만)"
        type: choice
        options: [auto, "yes", "no"]
        default: auto
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: collect (Raider.IO 쐐기 약 1,000번 요청 + 레이드 주 1회 약 570번)
        env:
          RAID: ${{ inputs.raid || 'auto' }}
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: bash tools/ci/collect.sh /tmp/stats.json
      - name: push data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/dataout && mkdir -p /tmp/dataout
          cp /tmp/stats.json /tmp/dataout/stats.json
          cp -R data/rank /tmp/dataout/rank
          mkdir -p /tmp/dataout/raid && if [ -f data/raid/comp.json ]; then cp data/raid/comp.json /tmp/dataout/raid/comp.json; fi
          if [ -f data/pvp/meta.json ]; then mkdir -p /tmp/dataout/pvp && cp data/pvp/meta.json /tmp/dataout/pvp/ && cp -R data/pvp/spec data/pvp/rank /tmp/dataout/pvp/; fi
          printf '%s\n' "# data 브랜치 (자동 생성)" "" "매일 04:00 KST GitHub Actions(site 워크플로)가 Raider.IO 쐐기 상위 500명 수치를 받아 이 브랜치를 커밋 1개로 덮어쓴다." "stats.json: roster 에 병합할 비율 수치, rank/: 순위표 파일, raid/comp.json: 레이드 순위(주 1회 목요일 갱신, 다른 날은 이어 씀). 사이트 코드는 main 에 있다." > /tmp/dataout/README.md
          cd /tmp/dataout
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "data: $(TZ=Asia/Seoul date '+%F %H:%M KST')"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
      - name: keep-alive (60일 비활성으로 예약 실행이 꺼지지 않게)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/site.yml/enable" || true
  deploy:
    needs: collect
    if: always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: assemble site (main 코드 + data 브랜치 수치)
        run: bash tools/ci/assemble.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
